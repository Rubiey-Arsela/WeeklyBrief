<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Maida Vale Weekly Brief</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<style>
  :root {
    --navy-900: #102320;
    --navy-800: #17302d;
    --navy-700: #295650;
    --navy-600: #316860;
    --navy-500: #3f837a;
    --slate-600: #475569;
    --slate-500: #64748b;
    --slate-300: #cbd5e1;
    --slate-200: #e2e8f0;
    --slate-100: #f1f5f9;
    --white: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: 'Trebuchet MS', 'Lucida Grande', 'Verdana', sans-serif;
    background: var(--slate-100);
    color: #1a1a2e;
  }
  .page {
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: radial-gradient(circle at 20% 15%, rgba(63,131,122,0.16), transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(41,86,80,0.14), transparent 50%),
                var(--slate-100);
  }
  .login-card {
    width: 100%;
    max-width: 400px;
    background: var(--white);
    border-radius: 12px;
    box-shadow: 0 24px 64px rgba(16, 35, 32, 0.14);
    overflow: hidden;
    border: 1px solid var(--slate-200);
  }
  .login-brand {
    background: var(--navy-900);
    padding: 36px 32px 28px;
    text-align: center;
  }
  .login-brand img {
    height: 34px;
    width: auto;
    margin-bottom: 14px;
  }
  .login-brand h1 {
    color: var(--white);
    font-size: 1.375rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .login-brand .subtitle {
    color: rgba(255,255,255,0.65);
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 4px;
  }
  .login-body {
    padding: 32px;
  }
  .login-body p.lede {
    font-size: 0.875rem;
    color: var(--slate-600);
    text-align: center;
    margin-bottom: 24px;
    line-height: 1.5;
  }
  .ms-signin-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    padding: 12px 20px;
    background: var(--white);
    border: 1px solid #8c8c8c;
    border-radius: 4px;
    font-size: 0.9375rem;
    font-weight: 600;
    color: #1a1a2e;
    cursor: pointer;
    text-decoration: none;
    transition: box-shadow 0.15s, border-color 0.15s;
  }
  .ms-signin-btn:hover {
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    border-color: #666;
  }
  .ms-signin-btn svg { flex-shrink: 0; }
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 24px 0;
    color: var(--slate-500);
    font-size: 0.75rem;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--slate-200);
  }
  .fallback-notice {
    font-size: 0.8125rem;
    color: var(--slate-500);
    background: var(--slate-100);
    border: 1px solid var(--slate-200);
    border-radius: 6px;
    padding: 12px 14px;
    line-height: 1.5;
    text-align: center;
  }
  .error-banner {
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #991b1b;
    font-size: 0.8125rem;
    border-radius: 6px;
    padding: 10px 14px;
    margin-bottom: 20px;
    line-height: 1.4;
  }
  .login-footer {
    padding: 18px 32px 26px;
    text-align: center;
    border-top: 1px solid var(--slate-200);
  }
  .powered-by {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--slate-500);
    font-size: 0.6875rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .powered-by img { height: 16px; width: auto; opacity: 0.85; }
</style>
</head>
<body>
<div class="page">
  <div class="login-card">
    <div class="login-brand">
      <h1>Maida Vale</h1>
      <div class="subtitle">Weekly Brief · Malaysia Sector Intelligence</div>
    </div>
    <div class="login-body">
      <div id="errorBanner" class="error-banner" style="display:none;"></div>
      <p class="lede">Sign in with your organisation's Microsoft 365 account to access this week's brief.</p>

      <a href="/auth/login" class="ms-signin-btn" id="msSignInBtn">
        <svg width="20" height="20" viewBox="0 0 21 21" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
          <rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
          <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>
          <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
        </svg>
        Sign in with Microsoft
      </a>

      <div id="unconfiguredNotice" class="fallback-notice" style="display:none; margin-top:20px;">
        Microsoft sign-in has not been configured for this deployment yet.
        Contact your administrator to complete setup.
      </div>
    </div>
    <div class="login-footer">
      <span class="powered-by">
        Powered by
        <img src="/static/logo-arsela.png" alt="Arsela Resources">
      </span>
    </div>
  </div>
</div>
<script>
  (function () {
    const params = new URLSearchParams(window.location.search);
    const err = params.get('error');
    if (err) {
      const banner = document.getElementById('errorBanner');
      const messages = {
        access_denied: 'Sign-in was cancelled.',
        domain_not_allowed: 'This Microsoft account is not authorised for this application. Please use your organisation account.',
        auth_failed: 'Sign-in failed. Please try again.',
        not_configured: 'Microsoft sign-in has not been configured for this deployment yet.',
      };
      banner.textContent = messages[err] || 'Sign-in failed. Please try again.';
      banner.style.display = 'block';
      if (err === 'not_configured') {
        document.getElementById('msSignInBtn').style.display = 'none';
        document.getElementById('unconfiguredNotice').style.display = 'block';
      }
    }
  })();
</script>
</body>
</html>
